                                    {/* Documents tab */}
                                    {activeTab === 'documents' && (
                                        <div className="p-6 max-w-5xl mx-auto">
                                            <div className="flex items-center justify-between mb-4">
                                                <h2 className="text-base font-bold text-gray-900">All Documents & Artifacts</h2>
                                                <button
                                                    onClick={() => setShowUpload(true)}
                                                    className="py-1.5 px-3 bg-forge-600 hover:bg-forge-700 text-white text-sm font-medium rounded-lg transition-colors flex items-center gap-1"
                                                >
                                                    <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/></svg>
                                                    Upload Document
                                                </button>
                                            </div>

                                            {editingArtifact ? (
                                                <div className="bg-white rounded-xl border border-gray-200 overflow-hidden">
                                                    <div className="px-4 py-3 bg-gray-50 border-b border-gray-200 flex items-center justify-between">
                                                        <div className="flex items-center gap-2">
                                                            <span className="text-xs font-bold text-gray-800">Editing: {editingArtifact}</span>
                                                            <span className="text-sm text-amber-600 bg-amber-50 px-2 py-0.5 rounded font-medium">EDIT MODE</span>
                                                        </div>
                                                        <div className="flex items-center gap-2">
                                                            <button onClick={() => { setEditingArtifact(null); setEditContent(''); }} className="px-3 py-1.5 text-xs text-gray-600 hover:text-gray-800">Cancel</button>
                                                            <button onClick={saveArtifact} className="px-3 py-1.5 bg-forge-600 hover:bg-forge-700 text-white text-xs font-medium rounded-lg">Save Changes</button>
                                                        </div>
                                                    </div>
                                                    <textarea
                                                        value={editContent}
                                                        onChange={e => setEditContent(e.target.value)}
                                                        className="w-full h-[600px] p-4 text-sm font-mono resize-none focus:outline-none editor-textarea"
                                                    />
                                                    <div className="px-4 py-2 bg-gray-50 border-t border-gray-200 flex items-center justify-between">
                                                        <p className="text-xs text-gray-400">After saving, use "Re-run From..." to regenerate downstream documents with your changes.</p>
                                                        <p className="text-xs text-gray-400">{editContent.length.toLocaleString()} chars</p>
                                                    </div>
                                                </div>
                                            ) : (
                                                <div className="space-y-3">
                                                    {Object.keys(artifacts).length === 0 ? (
                                                        <div className="text-center py-12 text-gray-400">
                                                            <p className="text-sm">No documents yet. Run stages or upload a context document.</p>
                                                        </div>
                                                    ) : Object.entries(artifacts).map(([name, content]) => {
                                                        const versions = state?.artifact_versions?.[name] || [];
                                                        return (
                                                        <div key={name} className="bg-white rounded-xl border border-gray-200 overflow-hidden">
                                                            <div className="px-4 py-2.5 bg-gray-50 border-b border-gray-100 flex items-center justify-between">
                                                                <div className="flex items-center gap-2">
                                                                    <svg className="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                                                                    <span className="text-xs font-bold text-gray-800">{name}</span>
                                                                    {state?.token_usage?.by_artifact?.[name] && (
                                                                        <span className="text-sm text-gray-400">{formatCost(state.token_usage.by_artifact[name].cost_usd)}</span>
                                                                    )}
                                                                    {versions.length > 0 && (
                                                                        <span className="text-sm text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded font-medium">v{versions.length + 1} ({versions.length} prior)</span>
                                                                    )}
                                                                </div>
                                                                <div className="flex items-center gap-1.5">
                                                                    {versions.length > 0 && (
                                                                        <select
                                                                            onChange={async (e) => {
                                                                                const ver = parseInt(e.target.value);
                                                                                if (!ver) return;
                                                                                const resp = await fetch(`${API_BASE}/api/artifact/${sessionId}/${name}/version/${ver}`);
                                                                                const data = await resp.json();
                                                                                if (data.content) { setEditingArtifact(name); setEditContent(data.content); }
                                                                                e.target.value = '';
                                                                            }}
                                                                            className="text-xs text-gray-500 border border-gray-200 rounded px-1.5 py-1 bg-white"
                                                                            defaultValue=""
                                                                        >
                                                                            <option value="" disabled>History</option>
                                                                            {versions.map(v => (
                                                                                <option key={v.version} value={v.version}>v{v.version} — {v.reason} ({new Date(v.timestamp).toLocaleString()})</option>
                                                                            ))}
                                                                        </select>
                                                                    )}
                                                                    <button
                                                                        onClick={() => {
                                                                            navigator.clipboard.writeText(content).then(() => {
                                                                                setCopiedName(name);
                                                                                setTimeout(() => setCopiedName(null), 2000);
                                                                            });
                                                                        }}
                                                                        className={`py-1 px-2.5 border text-xs font-medium rounded-lg transition-colors flex items-center gap-1 ${copiedName === name ? 'bg-green-50 border-green-300 text-green-700' : 'bg-white hover:bg-gray-100 border-gray-200 text-gray-600'}`}
                                                                        title={copiedName === name ? 'Copied!' : 'Copy to clipboard'}
                                                                    >
                                                                        {copiedName === name ? (
                                                                            <><svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"/></svg>Copied!</>
                                                                        ) : (
                                                                            <><svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>Copy</>
                                                                        )}
                                                                    </button>
                                                                    <button
                                                                        onClick={() => { setEditingArtifact(name); setEditContent(content); }}
                                                                        className="py-1 px-2.5 bg-white hover:bg-gray-100 border border-gray-200 text-gray-600 text-xs font-medium rounded-lg transition-colors flex items-center gap-1"
                                                                    >
                                                                        <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                                                                        Edit
                                                                    </button>
                                                                </div>
                                                            </div>
                                                            <div className="px-4 py-3 max-h-48 overflow-y-auto">
                                                                <div className="markdown-body" dangerouslySetInnerHTML={{ __html: renderMd(content?.slice(0, 2000) + (content?.length > 2000 ? '\n\n---\n*[Truncated preview — click Edit to see full content]*' : '')) }} />
                                                            </div>
                                                        </div>
                                                        );
                                                    })}
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {/* Stage-specific conversation tab */}
                                    {activeTab !== 'overview' && activeTab !== 'documents' && (
                                        <div className="flex h-full">
                                            {/* Conversation messages for this stage */}
                                            <div className="flex-1 overflow-y-auto p-4 space-y-2 max-w-4xl mx-auto">
                                                {(() => {
                                                    const stageMessages = getStageMessages(activeTab);
                                                    const stageConfig = stageTabs.find(s => s.id === activeTab);
                                                    const stageIdx = stageTabs.findIndex(s => s.id === activeTab);
                                                    const stageStatus = state?.stages?.[stageIdx]?.status;

                                                    if (stageMessages.length === 0 && !streaming) {
                                                        return (
                                                            <div className="flex items-center justify-center h-64">
                                                                <div className="text-center">
                                                                    <p className="text-sm text-gray-400">{stageConfig?.description || 'No activity yet'}</p>
                                                                    {stageStatus === 'pending' && (
                                                                        <p className="text-xs text-gray-300 mt-2">This stage hasn't been run yet.</p>
                                                                    )}
                                                                    {stageConfig?.participants && (
                                                                        <div className="mt-3 flex items-center justify-center gap-1.5">
                                                                            <span className="text-sm text-gray-300 mr-1">Participants:</span>
                                                                            {stageConfig.participants.map(pid => {
                                                                                const agent = config?.agents?.find(a => a.id === pid);
                                                                                return agent ? (
                                                                                    <span key={pid} className="inline-flex items-center gap-1 px-1.5 py-0.5 bg-gray-50 rounded text-sm text-gray-500 border border-gray-100">
                                                                                        <span className="w-1.5 h-1.5 rounded-full" style={{ backgroundColor: agent.color }}></span>
                                                                                        {agent.short}
                                                                                    </span>
                                                                                ) : null;
                                                                            })}
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        );
                                                    }

                                                    return (
                                                        <>
                                                            {stageConfig && (
                                                                <div className="py-2 mb-2">
                                                                    <p className="text-center text-xs text-gray-400">{stageConfig.description}</p>
                                                                </div>
                                                            )}
                                                            {stageMessages.map((msg, i) => {
                                                                if (msg.type === 'round_start') {
                                                                    return (
                                                                        <div key={i} className="text-center py-0.5">
                                                                            <span className="text-sm text-gray-300 uppercase tracking-wider">Round {msg.round}</span>
                                                                        </div>
                                                                    );
                                                                }
                                                                if (msg.type === 'message') {
                                                                    return (
                                                                        <div key={i} className="slide-in">
                                                                            <div className={`bg-white rounded-lg border shadow-sm overflow-hidden ${msg.is_artifact ? 'border-forge-300 ring-1 ring-forge-100' : 'border-gray-200'}`}>
                                                                                <div className={`px-3 py-1.5 border-b flex items-center gap-2 ${msg.is_artifact ? 'bg-forge-50 border-forge-100' : 'bg-gray-50 border-gray-100'}`}>
                                                                                    <span className="w-2 h-2 rounded-full flex-shrink-0" style={{ backgroundColor: msg.agent_color }}></span>
                                                                                    <span className="text-sm font-bold" style={{ color: msg.agent_color }}>{msg.agent_name}</span>
                                                                                    <span className="text-sm text-gray-400 bg-gray-100 px-1.5 py-0.5 rounded font-mono">{msg.agent_short}</span>
                                                                                    {msg.is_artifact && <span className="text-xs text-forge-500 bg-forge-100 px-1.5 py-0.5 rounded font-medium">ARTIFACT</span>}
                                                                                    {msg.model && <span className="text-xs text-gray-300 font-mono">{msg.model.replace('claude-', '')}</span>}
                                                                                    <span className="text-sm text-gray-300 ml-auto">r{msg.round}</span>
                                                                                    {msg.usage && <span className="text-xs text-gray-300">{formatTokens(msg.usage.output_tokens)} / {formatCost(msg.usage.cost_usd)}</span>}
                                                                                </div>
                                                                                <div className="px-3 py-2">
                                                                                    <div className="markdown-body" dangerouslySetInnerHTML={{ __html: renderMd(msg.content) }} />
                                                                                </div>
                                                                            </div>
                                                                        </div>
                                                                    );
                                                                }
                                                                if (msg.type === 'artifact_created') {
                                                                    return (
                                                                        <div key={i} className="slide-in flex justify-center py-2">
                                                                            <button
                                                                                onClick={() => { setActiveTab('documents'); }}
                                                                                className="inline-flex items-center gap-2 px-3 py-1.5 bg-green-50 border border-green-200 rounded-lg text-sm text-green-700 font-medium hover:bg-green-100 transition-colors"
                                                                            >
                                                                                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                                                                                {msg.artifact_name} created
                                                                            </button>
                                                                        </div>
                                                                    );
                                                                }
                                                                if (msg.type === 'stage_complete') {
                                                                    return (
                                                                        <div key={i} className="text-center py-1.5">
                                                                            <span className="inline-flex items-center gap-1 px-2.5 py-0.5 bg-green-50 border border-green-200 rounded-full text-xs text-green-600 font-medium">
                                                                                <svg className="w-2.5 h-2.5" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd"/></svg>
                                                                                Stage complete
                                                                            </span>
                                                                        </div>
                                                                    );
                                                                }
                                                                if (msg.type === 'stage_skipped') {
                                                                    return (
                                                                        <div key={i} className="text-center py-1.5">
                                                                            <span className="inline-flex items-center gap-1 px-2.5 py-0.5 bg-gray-100 border border-gray-200 rounded-full text-xs text-gray-500 font-medium">
                                                                                Skipped — not selected to run
                                                                            </span>
                                                                        </div>
                                                                    );
                                                                }
                                                                if (msg.type === 'forge_cancelled') {
                                                                    return (
                                                                        <div key={i} className="text-center py-1.5">
                                                                            <span className="inline-flex items-center gap-1 px-2.5 py-0.5 bg-amber-50 border border-amber-200 rounded-full text-xs text-amber-600 font-medium">
                                                                                Stopped by user
                                                                            </span>
                                                                        </div>
                                                                    );
                                                                }
                                                                return null;
                                                            })}
                                                            {/* Live streaming in this tab */}
                                                            {streamingMsgId && streamMeta.current && streamMeta.current.stage === activeTab && (
                                                                <div className="slide-in">
                                                                    <div className="bg-white rounded-lg border border-forge-300 shadow-sm overflow-hidden ring-1 ring-forge-100">
                                                                        <div className="px-3 py-1.5 bg-forge-50 border-b border-forge-100 flex items-center gap-2">
                                                                            <span className="pulse-dot w-2 h-2 rounded-full flex-shrink-0" style={{ backgroundColor: streamMeta.current.agent_color }}></span>
                                                                            <span className="text-sm font-bold" style={{ color: streamMeta.current.agent_color }}>{streamMeta.current.agent_name}</span>
                                                                            <span className="text-sm text-gray-400 bg-gray-100 px-1.5 py-0.5 rounded font-mono">{streamMeta.current.agent_short}</span>
                                                                            {streamMeta.current.is_artifact && <span className="text-xs text-forge-500 bg-forge-100 px-1.5 py-0.5 rounded font-medium">ARTIFACT</span>}
                                                                            {streamMeta.current.model && <span className="text-xs text-gray-300 font-mono">{streamMeta.current.model.replace('claude-', '')}</span>}
                                                                            <span className="inline-flex items-center gap-1 text-sm text-forge-500 font-medium ml-auto">
                                                                                <span className="pulse-dot w-1.5 h-1.5 bg-forge-400 rounded-full"></span>
                                                                                typing
                                                                            </span>
                                                                        </div>
                                                                        <div className="px-3 py-2 min-h-[2rem]">
                                                                            {streamingContent ? (
                                                                                <div className="markdown-body" dangerouslySetInnerHTML={{ __html: renderMd(streamingContent) }} />
                                                                            ) : (
                                                                                <span className="text-xs text-gray-400 italic">thinking...</span>
                                                                            )}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            )}
                                                            {streaming && streamMeta.current?.stage === activeTab && !streamingMsgId && (
                                                                <div className="text-center py-3">
                                                                    <span className="inline-flex items-center gap-2 text-xs text-forge-600 bg-forge-50 px-3 py-1.5 rounded-full border border-forge-200">
                                                                        <span className="pulse-dot w-2 h-2 bg-forge-500 rounded-full"></span>
                                                                        Preparing next agent...
                                                                    </span>
                                                                </div>
                                                            )}
                                                            <div ref={msgEndRef} />
                                                        </>
                                                    );
                                                })()}
                                            </div>

                                            {/* Right sidebar: participants for this stage */}
                                            <div className="w-44 border-l border-gray-200 bg-white flex-shrink-0 overflow-y-auto">
                                                <div className="p-3 border-b border-gray-100">
                                                    <h3 className="text-sm font-semibold text-gray-400 uppercase">Stage Participants</h3>
                                                </div>
                                                <div className="p-2 space-y-0.5">
                                                    {(() => {
                                                        const stageConfig = stageTabs.find(s => s.id === activeTab);
                                                        const participants = stageConfig?.participants || [];
                                                        return (config?.agents || []).filter(a => participants.includes(a.id)).map(a => {
                                                            const msgCount = messages.filter(m => m.type === 'message' && m.agent_id === a.id && m.stage === activeTab).length;
                                                            const isActive = activeAgent === a.id;
                                                            return (
                                                                <div key={a.id} className={`px-2 py-1.5 rounded-lg flex items-center gap-2 text-sm transition-all ${
                                                                    isActive ? 'bg-forge-50 border border-forge-200 shadow-sm' :
                                                                    msgCount > 0 ? 'bg-gray-50' : ''
                                                                }`}>
                                                                    <span className={`w-2 h-2 rounded-full flex-shrink-0 ${isActive ? 'pulse-dot' : ''}`} style={{ backgroundColor: a.color }}></span>
                                                                    <span className={`truncate ${isActive ? 'text-forge-700 font-bold' : msgCount > 0 ? 'text-gray-700 font-medium' : 'text-gray-400'}`}>{a.name}</span>
                                                                    {isActive && <span className="ml-auto text-xs text-forge-500 font-medium">speaking</span>}
                                                                    {!isActive && msgCount > 0 && <span className="ml-auto text-sm text-gray-400">{msgCount}</span>}
                                                                </div>
                                                            );
                                                        });
                                                    })()}
                                                </div>

                                                {/* Stage artifact quick link */}
                                                {(() => {
                                                    const stageConfig = stageTabs.find(s => s.id === activeTab);
                                                    if (stageConfig?.artifact && artifacts[stageConfig.artifact]) {
                                                        return (
                                                            <div className="border-t border-gray-100 p-2 mt-2">
                                                                <h4 className="text-sm font-semibold text-gray-400 uppercase px-2 mb-1.5">Artifact</h4>
                                                                <button
                                                                    onClick={() => { setActiveTab('documents'); setEditingArtifact(stageConfig.artifact); setEditContent(artifacts[stageConfig.artifact]); }}
                                                                    className="w-full text-left px-2.5 py-1.5 rounded-lg text-sm hover:bg-gray-100 text-gray-600 flex items-center gap-1.5"
                                                                >
                                                                    <svg className="w-3 h-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                                                                    Edit {stageConfig.artifact}
                                                                </button>
                                                            </div>
                                                        );
                                                    }
                                                    return null;
                                                })()}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Error toast */}
                    {error && !showNewProject && (
                        <div className="fixed bottom-4 right-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-xs max-w-sm shadow-lg flex items-start gap-2 z-40">
                            <span className="flex-1">{error}</span>
                            <button onClick={() => setError(null)} className="text-red-400 hover:text-red-600 font-bold">&times;</button>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
