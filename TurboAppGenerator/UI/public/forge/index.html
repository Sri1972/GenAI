<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Forge — Multi-Agent Product Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        forge: { 50: '#fdf4ff', 100: '#fae8ff', 200: '#f5d0fe', 300: '#f0abfc', 400: '#e879f9', 500: '#d946ef', 600: '#c026d3', 700: '#a21caf', 800: '#86198f', 900: '#701a75' }
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .pulse-dot { animation: pulse-dot 1.5s ease-in-out infinite; }
        @keyframes slide-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .slide-in { animation: slide-in 0.25s ease-out; }
        @keyframes speaking-ring { 0%, 100% { box-shadow: 0 0 0 0 rgba(217,70,239,0.45); } 50% { box-shadow: 0 0 0 9px rgba(217,70,239,0); } }
        .speaking-ring { animation: speaking-ring 1.3s ease-out infinite; }
        @keyframes talk-bar { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
        .talk-bar { animation: talk-bar 0.8s ease-in-out infinite; transform-origin: bottom; }
        @keyframes room-glow { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.85; } }
        .room-glow { animation: room-glow 3s ease-in-out infinite; }
        .markdown-body { font-size: 0.875rem; line-height: 1.7; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: 700; margin-top: 0.5rem; margin-bottom: 0.25rem; }
        .markdown-body h1 { font-size: 1.1rem; }
        .markdown-body h2 { font-size: 1rem; }
        .markdown-body h3 { font-size: 0.9375rem; }
        .markdown-body p { margin: 0.25rem 0; }
        .markdown-body strong { font-weight: 600; }
        .markdown-body ul, .markdown-body ol { padding-left: 1.25rem; margin: 0.25rem 0; }
        .markdown-body li { margin: 0.1rem 0; }
        .markdown-body hr { border: none; border-top: 1px solid #e5e7eb; margin: 0.5rem 0; }
        .markdown-body code { background: #f3f4f6; padding: 0.1rem 0.3rem; border-radius: 3px; font-size: 0.8rem; }
        .markdown-body pre { background: #1f2937; color: #e5e7eb; padding: 0.5rem; border-radius: 0.375rem; overflow-x: auto; margin: 0.4rem 0; font-size: 0.8rem; }
        .markdown-body pre code { background: none; color: inherit; }
        .markdown-body blockquote { border-left: 3px solid #d946ef; padding-left: 0.75rem; margin: 0.4rem 0; color: #6b7280; }
        * { scrollbar-width: thin; scrollbar-color: #d1d5db transparent; }
        .tab-active { border-bottom: 2px solid #c026d3; color: #86198f; font-weight: 600; }
        .tab-inactive { border-bottom: 2px solid transparent; color: #6b7280; }
        .tab-inactive:hover { color: #374151; border-bottom-color: #e5e7eb; }
        .editor-textarea { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 0.85rem; line-height: 1.6; }
    </style>
</head>
<body class="bg-gray-50 h-screen overflow-hidden">
    <div id="root" class="h-full"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;
        const API_BASE = 'http://localhost:8010';

        function renderMd(text) {
            if (!text) return '';
            return DOMPurify.sanitize(marked.parse(text));
        }

        function formatCost(cost) {
            if (!cost || cost === 0) return '$0.00';
            if (cost < 0.01) return '<$0.01';
            return '$' + cost.toFixed(2);
        }

        function formatTokens(n) {
            if (!n) return '0';
            if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
            if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
            return n.toString();
        }

        // Abstract, non-human line-icon per agent role — deliberately no faces,
        // skin tones, or gender/race representation of any kind, just a shape
        // that hints at what the role does. Falls back to a generic dot if an
        // agent id isn't in this list (new agent added to agents.json later).
        const AGENT_ICON_PATHS = {
            product_manager: 'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z',
            product_owner: 'M3 3v18h2v-8l2.5-1L10 13l2.5-1L15 13l2.5-1V4l-2.5 1L12.5 4 10 5 7.5 4 5 5V3H3z',
            business_analyst: 'M3 3v18h18M7 15l3-4 3 2 4-6',
            architect: 'M3 21h18M5 21V9l7-6 7 6v12M9 21v-6h6v6',
            fullstack_dev: 'M8 9l-3 3 3 3m8-6l3 3-3 3M14 4l-4 16',
            ui_developer: 'M4 5h16v11H4zM4 19h6M9 16v3',
            backend_engineer: 'M5 12a7 7 0 1114 0 7 7 0 01-14 0zM12 8v4l3 2',
            db_engineer: 'M4 6c0-1.1 3.6-2 8-2s8 .9 8 2-3.6 2-8 2-8-.9-8-2zm0 0v12c0 1.1 3.6 2 8 2s8-.9 8-2V6M4 12c0 1.1 3.6 2 8 2s8-.9 8-2',
            qa_engineer: 'M9 12l2 2 4-4m5 2a9 9 0 11-18 0 9 9 0 0118 0z',
            devops_engineer: 'M12 8a4 4 0 100 8 4 4 0 000-8zM12 2v3m0 14v3m8-8h-3M5 12H2m14.5-6.5l-2 2m-9 9l-2 2m0-13l2 2m9 9l2 2',
        };

        function AgentIcon({ agentId, className, style }) {
            const d = AGENT_ICON_PATHS[agentId];
            if (!d) return <span className={`${className} rounded-full bg-current opacity-60`} style={style}></span>;
            return (
                <svg className={className} style={style} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.75" d={d}></path>
                </svg>
            );
        }

        // Small animated "who's talking" equalizer — three bars bouncing out
        // of phase. Used both as a badge on the speaking agent's seat and on
        // the wall screen, so it takes a barClassName to size itself either way.
        function TalkBars({ className, barClassName }) {
            return (
                <div className={`flex items-end gap-[2px] ${className || ''}`}>
                    {[0, 0.15, 0.3].map((delay, idx) => (
                        <span key={idx} className={`talk-bar bg-current rounded-full ${barClassName || 'w-[3px] h-3'}`} style={{ animationDelay: `${delay}s` }}></span>
                    ))}
                </div>
            );
        }

        // Visual reskin of the same "who's working right now" model already
        // driving the Stage Participants sidebar — no new state, no fabricated
        // progress. The orchestrator only ever runs one agent at a time
        // (ProductForge/backend/orchestrator.py's run_stage is a plain
        // sequential loop), so exactly one seat glows "active"; everyone else
        // in the current stage's participant list is "waiting their turn";
        // anyone seated in an earlier stage (complete or currently running)
        // is "done" for now — they may light up again in a later stage, e.g.
        // the Architect returns for trd/design/specs/review.
        function ConferenceRoom({ agents, stageTabs, stageStates, activeAgent, onUpload, onToggleAgent, savingParticipants }) {
            if (!agents || !agents.length) return null;
            // The one stage a user can still customize the roster for — the
            // orchestrator runs stages strictly in order, so there's always
            // at most one "pending" entry at a time (everything before it is
            // complete/skipped, everything after hasn't been reached yet).
            const nextStageIdx = (stageStates || []).findIndex(s => s.status === 'pending');
            const runningIdx = (stageStates || []).findIndex(s => s.status === 'running');
            let currentStage = runningIdx >= 0 ? stageTabs[runningIdx] : null;
            let currentStageIdx = runningIdx;
            if (!currentStage && activeAgent) {
                // Belt-and-suspenders: if a per-stage status hasn't caught up
                // yet (e.g. right on session resume), infer the current stage
                // from whichever unfinished stage the speaking agent belongs to.
                // Uses stageStates' own (effective, possibly-customized)
                // participants — see the note on currentParticipants below.
                const idx = stageTabs.findIndex((s, i) => {
                    const st = stageStates?.[i];
                    return (st?.participants || []).includes(activeAgent) && st?.status !== 'complete' && st?.status !== 'skipped';
                });
                if (idx >= 0) { currentStage = stageTabs[idx]; currentStageIdx = idx; }
            }
            // stageStates[i].participants (from the session's own get_state()),
            // NOT stageTabs[i].participants (the shared config default) — a
            // stage's roster can be customized per-session (see the team panel
            // below), and only the former reflects that.
            const currentParticipants = currentStageIdx >= 0 ? (stageStates?.[currentStageIdx]?.participants || []) : [];
            const completeCount = (stageStates || []).filter(s => s.status === 'complete').length;
            const totalCount = stageTabs.length || 1;

            function statusFor(agentId) {
                if (agentId === activeAgent) return 'active';
                if (currentParticipants.includes(agentId)) return 'waiting';
                const hasParticipated = (stageStates || []).some(s =>
                    s.status !== 'pending' && (s.participants || []).includes(agentId)
                );
                return hasParticipated ? 'done' : 'idle';
            }

            const n = agents.length;
            // Leave a gap centered at the top of the ellipse (where the wall
            // screen sits) and spread seats across the remaining arc only —
            // a full 360° distribution puts a seat directly behind the
            // screen, overlapping it.
            const gapDeg = 70;
            const startDeg = -90 + gapDeg / 2;
            const arcDeg = 360 - gapDeg;
            const seats = agents.map((a, i) => {
                const deg = n > 1 ? startDeg + (i / (n - 1)) * arcDeg : -90;
                const angle = deg * Math.PI / 180;
                const rx = 44, ry = 36; // ellipse radii, in %
                const left = 50 + rx * Math.cos(angle);
                const top = 50 + ry * Math.sin(angle);
                return { agent: a, left, top, status: statusFor(a.id) };
            });

            return (
                <div className="bg-white rounded-xl border border-gray-200 p-5">
                    <div className="flex items-center justify-between mb-3">
                        <h3 className="text-base font-bold text-gray-900">Conference Room</h3>
                        <span className="text-xs text-gray-400">{completeCount} / {totalCount} stages complete</span>
                    </div>

                    <div className="flex gap-4 items-start">
                    <div
                        className="relative flex-1 rounded-2xl overflow-hidden shadow-inner"
                        style={{
                            width: '100%', maxWidth: '900px', height: '460px',
                            // Wall fades into floor over a wide band instead of a hard
                            // cut — a flat 2-tone split (old version) left a harsh seam
                            // running straight across the middle of the room, right
                            // through the seats.
                            background: 'linear-gradient(180deg, #eef1f6 0%, #e9e7e1 20%, #ddd2ba 36%, #d3bf95 52%, #c7ac79 100%)',
                        }}
                    >
                        {/* Ceiling spotlight */}
                        <div className="room-glow absolute -top-10 left-1/2 -translate-x-1/2 w-72 h-40 rounded-full pointer-events-none"
                             style={{ background: 'radial-gradient(ellipse at center, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 70%)' }}></div>

                        {/* Windows, for atmosphere */}
                        <div className="absolute top-4 left-10 w-16 h-24 rounded-md border-2 border-slate-300 shadow-inner" style={{ background: 'linear-gradient(to bottom, #bfe3f7, #eaf6ff)' }}></div>
                        <div className="absolute top-4 right-10 w-16 h-24 rounded-md border-2 border-slate-300 shadow-inner" style={{ background: 'linear-gradient(to bottom, #bfe3f7, #eaf6ff)' }}></div>

                        {/* Back wall screen — shows current stage of the workflow */}
                        <div className="absolute top-4 left-1/2 -translate-x-1/2 w-72 h-28 bg-gray-900 rounded-lg flex flex-col items-center justify-center shadow-lg border-4 border-gray-700">
                            <span className="text-[10px] text-gray-400 uppercase tracking-wide">Now presenting</span>
                            <span className="text-sm font-bold text-white mt-0.5 text-center px-2 truncate max-w-full">
                                {currentStage ? currentStage.name : 'Session idle'}
                            </span>
                            {currentStage ? (
                                <>
                                    <span className="text-[9px] text-forge-300 mt-0.5">Stage {currentStageIdx + 1} of {totalCount}</span>
                                    <TalkBars className="text-forge-400 mt-1" barClassName="w-[3px] h-2.5" />
                                </>
                            ) : (
                                <span className="w-1.5 h-1.5 bg-gray-600 rounded-full mt-2"></span>
                            )}
                        </div>

                        {/* Table — a big boardroom oval now that the room has room to spare */}
                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[27rem] h-52 rounded-full shadow-lg flex items-center justify-center"
                             style={{ background: 'linear-gradient(135deg, #d6a35c 0%, #b9793a 55%, #a6672e 100%)', border: '3px solid #8a561f' }}>
                            <div className="absolute inset-3 rounded-full border border-white/25"></div>
                            <div className="w-10 h-10 rounded-full bg-gray-800 flex items-center justify-center shadow-md ring-4 ring-white/10" title="Speakerphone">
                                <svg className="w-4 h-4 text-gray-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h2.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                            </div>
                        </div>

                        {/* Chair shadows */}
                        {seats.map(({ agent: a, left, top }) => (
                            <div key={`shadow-${a.id}`} className="absolute -translate-x-1/2 -translate-y-1/2 w-10 h-4 bg-black/10 rounded-full blur-[2px]"
                                 style={{ left: `${left}%`, top: `${top + 8}%` }}></div>
                        ))}

                        {/* Seats */}
                        {seats.map(({ agent: a, left, top, status }) => (
                            <div
                                key={a.id}
                                title={a.name}
                                className="absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center transition-all"
                                style={{ left: `${left}%`, top: `${top}%`, opacity: status === 'idle' ? 0.45 : 1 }}
                            >
                                <div
                                    className={`relative w-11 h-11 rounded-2xl flex items-center justify-center shadow-sm transition-all
                                        ${status === 'active' ? 'speaking-ring scale-110' : ''}
                                        ${status === 'waiting' ? 'animate-pulse' : ''}`}
                                    style={{ backgroundColor: status === 'done' ? '#e5e7eb' : (a.color + '22'), border: `2px solid ${status === 'done' ? '#9ca3af' : a.color}` }}
                                >
                                    <AgentIcon agentId={a.id} className="w-5 h-5" style={{ color: status === 'done' ? '#6b7280' : a.color }} />
                                    {status === 'active' && (
                                        <span className="absolute -bottom-1.5 -right-1.5 bg-forge-600 text-white rounded-full px-1 py-0.5 shadow border-2 border-white">
                                            <TalkBars barClassName="w-[2px] h-2" />
                                        </span>
                                    )}
                                    {status === 'done' && (
                                        <span className="absolute -top-1 -right-1 w-4 h-4 bg-green-500 rounded-full border-2 border-white flex items-center justify-center">
                                            <svg className="w-2.5 h-2.5 text-white" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd"/></svg>
                                        </span>
                                    )}
                                </div>
                                <span className={`mt-1 text-[10px] font-medium px-1 rounded ${status === 'active' ? 'text-forge-700 font-bold' : 'text-gray-500'}`}>{a.short}</span>
                                {status === 'active' && (
                                    <span className="text-[9px] text-forge-500 -mt-0.5 font-semibold">speaking</span>
                                )}
                                {status === 'waiting' && (
                                    <span className="text-[9px] text-gray-400 -mt-0.5">up next</span>
                                )}
                            </div>
                        ))}

                        {/* Corner decor */}
                        <div className="absolute bottom-3 left-3 opacity-70">
                            <svg className="w-7 h-7 text-emerald-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M12 21v-8m0 0c-4-.5-6-3-6-6 3 0 5.5 1.5 6 4m0 2c.5-2.5 3-4 6-4 0 3-2 5.5-6 6zm-4 8h8"/></svg>
                        </div>

                        {/* In-tray — upload a context document without leaving the room */}
                        <button
                            onClick={onUpload}
                            title="Add a context document for the agents"
                            className="absolute bottom-3 right-3 flex items-center gap-1.5 bg-white/90 hover:bg-white border border-amber-300 rounded-lg px-2.5 py-1.5 shadow-sm text-amber-700 text-xs font-medium transition-all hover:scale-105"
                        >
                            <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
                            In-tray
                        </button>
                    </div>

                    {/* Team panel — to the right of the room where it's easy to
                        see, not tucked below the artifact shelf. Defaults are
                        pre-selected per stage (agents.json); toggle any agent
                        on/off for whichever stage hasn't started yet. Locked
                        once that stage begins — its artifact will reflect
                        whoever actually took part, so changing the roster
                        after the fact would be misleading. */}
                    {nextStageIdx >= 0 && (
                        <div className="flex-shrink-0 w-60 rounded-2xl border border-gray-100 bg-gray-50/60 p-3" style={{ height: '460px', overflowY: 'auto' }}>
                            <p className="text-xs font-semibold text-gray-500 mb-3">
                                Team for next stage<br />
                                <span className="text-gray-700">{stageTabs[nextStageIdx]?.name}</span>
                            </p>
                            <div className="grid grid-cols-2 gap-x-2 gap-y-2.5">
                                {[0, 1].map(col => (
                                    <div key={col} className="space-y-2.5">
                                        {agents.filter((_, i) => i % 2 === col).map(a => {
                                            const active = (stageStates[nextStageIdx]?.participants || []).includes(a.id);
                                            return (
                                                <div key={a.id} className="flex items-center justify-between gap-1">
                                                    <span className="flex items-center gap-1 text-xs text-gray-700 truncate" title={a.name}>
                                                        <span className="w-1.5 h-1.5 rounded-full flex-shrink-0" style={{ backgroundColor: a.color }}></span>
                                                        {a.short}
                                                    </span>
                                                    <label className="relative inline-flex items-center cursor-pointer flex-shrink-0">
                                                        <input type="checkbox" checked={active} disabled={savingParticipants}
                                                            onChange={() => onToggleAgent(stageTabs[nextStageIdx].id, a.id)} className="sr-only peer" />
                                                        <div className="w-7 h-4 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-3 peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-forge-500 peer-disabled:opacity-50"></div>
                                                    </label>
                                                </div>
                                            );
                                        })}
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                    </div>

                    {/* Artifact shelf — which artifacts are done, running, or still pending */}
                    <div className="mt-4 flex items-center gap-1.5 overflow-x-auto pb-1">
                        <span className="text-[10px] uppercase text-gray-400 font-semibold flex-shrink-0 mr-1">Artifacts</span>
                        {stageTabs.map((s, i) => {
                            const st = stageStates?.[i]?.status;
                            const done = st === 'complete';
                            const running = st === 'running' || currentStageIdx === i;
                            const skipped = st === 'skipped';
                            return (
                                <span
                                    key={s.id}
                                    title={s.name}
                                    className={`flex-shrink-0 inline-flex items-center gap-1 px-2 py-1 rounded-md text-[11px] border whitespace-nowrap ${
                                        done ? 'bg-green-50 border-green-200 text-green-700' :
                                        running ? 'bg-forge-50 border-forge-200 text-forge-700' :
                                        skipped ? 'bg-gray-50 border-gray-200 text-gray-400 italic line-through' :
                                        'bg-gray-50 border-gray-200 text-gray-400'
                                    }`}
                                >
                                    {done && (
                                        <svg className="w-3 h-3 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd"/></svg>
                                    )}
                                    {running && <span className="pulse-dot w-1.5 h-1.5 bg-forge-500 rounded-full flex-shrink-0"></span>}
                                    {!done && !running && !skipped && <span className="w-1.5 h-1.5 bg-gray-300 rounded-full flex-shrink-0"></span>}
                                    {s.name}
                                </span>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function App() {
            const [projects, setProjects] = useState([]);
            const [config, setConfig] = useState(null);
            const [showNewProject, setShowNewProject] = useState(false);
            const [newName, setNewName] = useState('');
            const [newIdea, setNewIdea] = useState('');
            const [draftMode, setDraftMode] = useState(true);
            const [draftModelInfo, setDraftModelInfo] = useState(null);
            const [techProfiles, setTechProfiles] = useState([]);
            const [techProfile, setTechProfile] = useState('');
            const [error, setError] = useState(null);

            const [activeProjectId, setActiveProjectId] = useState(null);
            const [sessionId, setSessionId] = useState(null);
            const [state, setState] = useState(null);
            const [messages, setMessages] = useState([]);
            const [artifacts, setArtifacts] = useState({});
            const [streaming, setStreaming] = useState(false);
            // True from the moment Stop is clicked until streaming actually turns
            // false — cancellation is cooperative (see /api/cancel), so there can be
            // a real gap while the in-flight LLM call finishes before it takes effect.
            const [stopping, setStopping] = useState(false);

            // Tabbed view state
            const [activeTab, setActiveTab] = useState('overview');
            // Artifact editor
            const [editingArtifact, setEditingArtifact] = useState(null);
            const [editContent, setEditContent] = useState('');
            // Upload modal
            const [showUpload, setShowUpload] = useState(false);
            const [uploadName, setUploadName] = useState('');
            const [uploadContent, setUploadContent] = useState('');
            // Run from stage modal
            const [showRunFrom, setShowRunFrom] = useState(false);
            // Run-selected (artifact picker) modal
            const [showStageSelect, setShowStageSelect] = useState(false);
            const [selectedStageIds, setSelectedStageIds] = useState([]);
            // Delete confirmation modal
            const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
            // Copy feedback
            const [copiedName, setCopiedName] = useState(null);
            // Per-stage team customization (Conference Room toggles)
            const [savingParticipants, setSavingParticipants] = useState(false);

            // Streaming state
            const [activeAgent, setActiveAgent] = useState(null);
            const [streamingContent, setStreamingContent] = useState('');
            const [streamingMsgId, setStreamingMsgId] = useState(null);
            const streamMeta = useRef(null);
            const msgEndRef = useRef(null);
            const eventSourceRef = useRef(null);

            useEffect(() => {
                fetch(`${API_BASE}/api/config`).then(r => r.json()).then(setConfig).catch(() => {});
                fetch(`${API_BASE}/api/tech-profiles`).then(r => r.json()).then(data => {
                    const profiles = data.profiles || [];
                    setTechProfiles(profiles);
                    const fallback = profiles.find(p => p.id === data.default_profile) || profiles[0];
                    if (fallback) setTechProfile(fallback.id);
                }).catch(() => {});
                fetch(`${API_BASE}/api/draft-model`).then(r => r.json()).then(setDraftModelInfo).catch(() => {});
                loadProjects();
            }, []);

            useEffect(() => {
                if (msgEndRef.current) {
                    msgEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [messages, streamingContent]);

            // While a stage is actively running, loadProjects() otherwise only
            // gets called again on stage_done/forge_done — so the left panel
            // list kept showing whatever status it had before this run started
            // (usually "paused" from the last completion) for the run's whole
            // duration. Refresh it periodically so it catches up promptly.
            useEffect(() => {
                if (!streaming) return;
                const t = setInterval(loadProjects, 4000);
                return () => clearInterval(t);
            }, [streaming]);

            const loadProjects = () => {
                fetch(`${API_BASE}/api/projects`).then(r => r.json()).then(setProjects).catch(() => setProjects([]));
            };

            const connectSSE = useCallback((sid) => {
                if (eventSourceRef.current) eventSourceRef.current.close();
                const es = new EventSource(`${API_BASE}/api/stream/${sid}`);
                eventSourceRef.current = es;
                es.onmessage = (e) => {
                    try {
                        const evt = JSON.parse(e.data);
                        if (evt.type === 'stage_done' || evt.type === 'forge_done') {
                            setState(evt.state);
                            setStreaming(false);
                            setStopping(false);
                            setActiveAgent(null);
                            setStreamingContent('');
                            setStreamingMsgId(null);
                            streamMeta.current = null;
                            fetch(`${API_BASE}/api/artifacts/${sid}`)
                                .then(r => r.json())
                                .then(data => setArtifacts(data.artifacts || {}));
                            loadProjects();
                        } else if (evt.type === 'message_start') {
                            setActiveAgent(evt.agent_id);
                            setStreamingMsgId(evt.msg_id);
                            setStreamingContent('');
                            streamMeta.current = evt;
                            // Deliberately no auto-switch to the stage's tab here —
                            // the Overview tab's Conference Room already shows who's
                            // speaking, so a run should stay on Overview by default;
                            // the user can click into a specific stage tab themselves.
                        } else if (evt.type === 'token') {
                            setStreamingContent(prev => prev + evt.content);
                        } else if (evt.type === 'message') {
                            setStreamingContent('');
                            setStreamingMsgId(null);
                            setActiveAgent(null);
                            streamMeta.current = null;
                            setMessages(prev => [...prev, evt]);
                        } else {
                            setMessages(prev => [...prev, evt]);
                            if (evt.type === 'stage_start' && evt.stage) {
                                // No auto-switch to the stage's tab here either — see the
                                // message_start handler above for why.
                                // Flip this specific stage's own status to 'running' too —
                                // previously only the top-level state.status was updated here,
                                // so state.stages[i].status stayed 'pending' for the whole
                                // stage (it only ever became 'complete' on the next full-state
                                // snapshot at stage_done), which is why the Conference Room
                                // screen and the stage-tab pulse dot never lit up while an
                                // agent was actively speaking.
                                setState(prev => prev ? {
                                    ...prev,
                                    status: 'running',
                                    stages: (prev.stages || []).map(s => s.id === evt.stage ? { ...s, status: 'running' } : s),
                                } : prev);
                            }
                        }
                    } catch (err) {}
                };
                es.onerror = () => {};
            }, []);

            const createProject = async () => {
                if (!newName.trim() || !newIdea.trim()) return;
                setError(null);
                try {
                    const resp = await fetch(`${API_BASE}/api/start`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: newName.trim(), idea: newIdea.trim(), draft_mode: draftMode, tech_profile: techProfile || null }),
                    });
                    const data = await resp.json();
                    setSessionId(data.session_id);
                    setState(data.state);
                    setActiveProjectId(data.session_id);
                    setMessages([]);
                    setArtifacts({});
                    setActiveTab('overview');
                    setEditingArtifact(null);
                    setShowNewProject(false);
                    setNewName('');
                    setNewIdea('');
                    connectSSE(data.session_id);
                    loadProjects();
                } catch (e) {
                    setError('Cannot connect to Product Forge server. Is it running on port 8010?');
                }
            };

            const openProject = async (project) => {
                setError(null);
                setEditingArtifact(null);
                try {
                    const resp = await fetch(`${API_BASE}/api/project/${project.session_id}/resume`, { method: 'POST' });
                    const data = await resp.json();
                    setSessionId(project.session_id);
                    setState(data.state);
                    setActiveProjectId(project.session_id);
                    const projResp = await fetch(`${API_BASE}/api/project/${project.session_id}`);
                    const projData = await projResp.json();
                    setMessages(projData.messages || []);
                    setArtifacts(projData.artifacts || {});
                    // Always land on Overview — its Conference Room shows the
                    // in-progress stage and who's speaking regardless of status,
                    // and the user can click into a specific stage tab themselves.
                    setActiveTab('overview');
                    setStreaming(data.state?.status === 'running');
                    connectSSE(project.session_id);
                } catch (e) {
                    setError('Failed to load project');
                }
            };

            const runNextStage = async () => {
                setError(null);
                setStreaming(true);
                try {
                    const resp = await fetch(`${API_BASE}/api/run-stage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_id: sessionId }),
                    });
                    const data = await resp.json();
                    if (data.error) { setError(data.error); setStreaming(false); }
                } catch (e) {
                    setError(`Request failed: ${e.message}`);
                    setStreaming(false);
                }
            };

            const openStageSelectModal = () => {
                const remaining = (state?.stages || []).filter(s => s.artifact && s.status === 'pending');
                setSelectedStageIds(remaining.map(s => s.id));
                setShowStageSelect(true);
            };

            const toggleStageSelection = (stageId) => {
                setSelectedStageIds(prev => prev.includes(stageId) ? prev.filter(id => id !== stageId) : [...prev, stageId]);
            };

            const runSelectedStages = async () => {
                setShowStageSelect(false);
                setError(null);
                setStreaming(true);
                try {
                    await fetch(`${API_BASE}/api/run-selected`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_id: sessionId, stage_ids: selectedStageIds }),
                    });
                } catch (e) {
                    setError(`Request failed: ${e.message}`);
                    setStreaming(false);
                }
            };

            const upgradeToQuality = async () => {
                setError(null);
                setStreaming(true);
                try {
                    await fetch(`${API_BASE}/api/upgrade-quality`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_id: sessionId }),
                    });
                } catch (e) {
                    setError(`Request failed: ${e.message}`);
                    setStreaming(false);
                }
            };

            const runFromStage = async (stageIdx) => {
                setError(null);
                setStreaming(true);
                setShowRunFrom(false);
                try {
                    await fetch(`${API_BASE}/api/run-from-stage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_id: sessionId, stage_idx: stageIdx }),
                    });
                } catch (e) {
                    setError(`Request failed: ${e.message}`);
                    setStreaming(false);
                }
            };

            const cancelRun = async () => {
                if (!sessionId || !streaming) return;
                setStopping(true);
                try {
                    const resp = await fetch(`${API_BASE}/api/cancel`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_id: sessionId }),
                    });
                    const data = await resp.json();
                    if (data.error) { setError(data.error); setStopping(false); }
                } catch (e) {
                    setError(`Request failed: ${e.message}`);
                    setStopping(false);
                }
            };

            const toggleStageAgent = async (stageId, agentId) => {
                const stageIdx = (state?.stages || []).findIndex(s => s.id === stageId);
                const current = state?.stages?.[stageIdx]?.participants || [];
                const next = current.includes(agentId) ? current.filter(a => a !== agentId) : [...current, agentId];
                if (next.length === 0) return; // mirrors the backend's "at least one participant" rule
                setSavingParticipants(true);
                try {
                    const resp = await fetch(`${API_BASE}/api/stage-participants`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_id: sessionId, stage_id: stageId, agent_ids: next }),
                    });
                    const data = await resp.json();
                    if (data.error) setError(data.error);
                    else setState(data.state);
                } catch (e) {
                    setError(`Request failed: ${e.message}`);
                } finally {
                    setSavingParticipants(false);
                }
            };

            const saveArtifact = async () => {
                if (!editingArtifact || !editContent) return;
                try {
                    await fetch(`${API_BASE}/api/update-artifact`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_id: sessionId, artifact_name: editingArtifact, content: editContent }),
                    });
                    setArtifacts(prev => ({ ...prev, [editingArtifact]: editContent }));
                    setEditingArtifact(null);
                    setEditContent('');
                } catch (e) {
                    setError('Failed to save artifact');
                }
            };

            const uploadDocument = async () => {
                if (!uploadName.trim() || !uploadContent.trim()) return;
                const docName = uploadName.trim().endsWith('.md') ? uploadName.trim() : uploadName.trim() + '.md';
                try {
                    await fetch(`${API_BASE}/api/upload-context`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_id: sessionId, name: docName, content: uploadContent.trim() }),
                    });
                    setArtifacts(prev => ({ ...prev, [docName]: uploadContent.trim() }));
                    setShowUpload(false);
                    setUploadName('');
                    setUploadContent('');
                } catch (e) {
                    setError('Failed to upload document');
                }
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setUploadName(file.name);
                const reader = new FileReader();
                reader.onload = (evt) => setUploadContent(evt.target.result);
                reader.readAsText(file);
            };

            const deleteProject = async () => {
                if (!sessionId) return;
                try {
                    const resp = await fetch(`${API_BASE}/api/project/${sessionId}`, { method: 'DELETE' });
                    const data = await resp.json();
                    if (data.error) { setError(data.error); return; }
                    // Clean up local state
                    if (eventSourceRef.current) eventSourceRef.current.close();
                    setActiveProjectId(null);
                    setSessionId(null);
                    setState(null);
                    setMessages([]);
                    setArtifacts({});
                    setActiveTab('overview');
                    setEditingArtifact(null);
                    setShowDeleteConfirm(false);
                    loadProjects();
                } catch (e) {
                    setError('Failed to delete project');
                }
            };

            // Get stage tabs from config
            const stageTabs = config?.stages || [];
            // Get messages for a specific stage
            const getStageMessages = (stageId) => messages.filter(m => m.stage === stageId);
            // Find which stage an artifact belongs to
            const getArtifactStage = (artifactName) => {
                const stage = stageTabs.find(s => s.artifact === artifactName);
                return stage ? stage.id : null;
            };

            return (
                <div className="h-full flex">
                    {/* LEFT SIDEBAR */}
                    <div className="w-64 bg-white border-r border-gray-200 flex flex-col flex-shrink-0">
                        <div className="p-4 border-b border-gray-100">
                            <div className="flex items-center gap-2 mb-3">
                                <div className="w-7 h-7 bg-forge-100 rounded-lg flex items-center justify-center">
                                    <svg className="w-3.5 h-3.5 text-forge-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
                                </div>
                                <h1 className="text-base font-bold text-gray-900">Product Forge</h1>
                            </div>
                            <button
                                onClick={() => setShowNewProject(true)}
                                className="w-full py-2 px-3 bg-forge-600 hover:bg-forge-700 text-white text-xs font-medium rounded-lg transition-colors flex items-center justify-center gap-1.5"
                            >
                                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/></svg>
                                New Project
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-2 space-y-1">
                            {projects.length === 0 && (
                                <div className="text-center py-8 px-4">
                                    <svg className="w-8 h-8 text-gray-200 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                                    <p className="text-xs text-gray-400">No projects yet</p>
                                </div>
                            )}
                            {projects.map(p => (
                                <button
                                    key={p.session_id}
                                    onClick={() => openProject(p)}
                                    className={`w-full text-left px-3 py-2.5 rounded-lg transition-colors group ${
                                        activeProjectId === p.session_id
                                            ? 'bg-forge-50 border border-forge-200'
                                            : 'hover:bg-gray-50 border border-transparent'
                                    }`}
                                >
                                    <p className={`text-xs font-medium truncate ${
                                        activeProjectId === p.session_id ? 'text-forge-700' : 'text-gray-700 group-hover:text-gray-900'
                                    }`}>{p.project_name || p.product_idea}</p>
                                    <div className="flex items-center gap-2 mt-1">
                                        <span className={`text-sm font-medium px-1.5 py-0.5 rounded ${
                                            p.status === 'complete' ? 'bg-green-100 text-green-700' :
                                            p.status === 'running' ? 'bg-forge-100 text-forge-700' :
                                            'bg-gray-100 text-gray-500'
                                        }`}>{p.status}</span>
                                        {p.token_usage?.total_cost_usd > 0 && (
                                            <span className="text-sm text-gray-300">{formatCost(p.token_usage.total_cost_usd)}</span>
                                        )}
                                    </div>
                                </button>
                            ))}
                        </div>

                        {config && (
                            <div className="border-t border-gray-100 p-3">
                                <h4 className="text-sm font-semibold text-gray-400 uppercase mb-1.5">Agent Team</h4>
                                <div className="flex flex-wrap gap-1">
                                    {config.agents.map(a => (
                                        <span key={a.id} className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-sm text-gray-500" title={a.name}>
                                            <span className="w-1.5 h-1.5 rounded-full" style={{ backgroundColor: a.color }}></span>
                                            {a.short}
                                        </span>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* MAIN AREA */}
                    <div className="flex-1 flex flex-col overflow-hidden">
                        {/* New Project Modal */}
                        {showNewProject && (
                            <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/30">
                                <div className="bg-white rounded-xl shadow-2xl border border-gray-200 w-full max-w-lg mx-4 p-6">
                                    <div className="flex items-center justify-between mb-4">
                                        <h2 className="text-lg font-bold text-gray-900">New Project</h2>
                                        <button onClick={() => setShowNewProject(false)} className="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
                                    </div>
                                    <p className="text-sm text-gray-500 mb-4">Give your project a name and describe what you want to build.</p>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-medium text-gray-700 mb-1.5">Project Name</label>
                                            <input
                                                type="text"
                                                value={newName}
                                                onChange={e => setNewName(e.target.value)}
                                                className="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-forge-500 focus:border-forge-500 text-sm"
                                                placeholder="e.g., ReceiptSnap, FleetTracker..."
                                                autoFocus
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-gray-700 mb-1.5">Product Description</label>
                                            <textarea
                                                value={newIdea}
                                                onChange={e => setNewIdea(e.target.value)}
                                                className="w-full h-28 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-forge-500 focus:border-forge-500 resize-none text-sm"
                                                placeholder="Describe what the product does, who it's for, and the key problem it solves..."
                                            />
                                        </div>
                                        {techProfiles.length > 0 && (
                                            <div>
                                                <label className="block text-xs font-medium text-gray-700 mb-1.5">Tech Stack Profile</label>
                                                <select
                                                    value={techProfile}
                                                    onChange={e => setTechProfile(e.target.value)}
                                                    className="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-forge-500 focus:border-forge-500 text-sm bg-white"
                                                >
                                                    {techProfiles.map(p => (
                                                        <option key={p.id} value={p.id}>{p.label}</option>
                                                    ))}
                                                </select>
                                                <p className="text-xs text-gray-400 mt-1">
                                                    {techProfiles.find(p => p.id === techProfile)?.description || 'Governs the technology choices the agents are allowed to propose in TRD, Solution Design, Specs, and Tasks.'}
                                                </p>
                                            </div>
                                        )}
                                    </div>
                                    <div className="mt-4 flex items-center justify-between px-1">
                                        <div className="flex items-center gap-3">
                                            <label className="relative inline-flex items-center cursor-pointer">
                                                <input type="checkbox" checked={draftMode} onChange={e => setDraftMode(e.target.checked)} className="sr-only peer" />
                                                <div className="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-forge-500"></div>
                                            </label>
                                            <div>
                                                <span className="text-xs font-medium text-gray-700">Draft Mode</span>
                                                <p className="text-xs text-gray-400">
                                                    {draftMode
                                                        ? `Fast & cheap (~$0.50-$1). Uses whichever model is currently cheapest & online${draftModelInfo?.label ? ` (right now: ${draftModelInfo.label})` : ''}, skips critique rounds.`
                                                        : 'Full quality (~$6-$7). Uses Sonnet for artifacts + critique-and-refine.'}
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="flex justify-end gap-3 mt-5">
                                        <button onClick={() => setShowNewProject(false)} className="px-4 py-2 text-sm text-gray-600 hover:text-gray-800">Cancel</button>
                                        <button
                                            onClick={createProject}
                                            disabled={!newName.trim() || !newIdea.trim()}
                                            className="px-6 py-2 bg-forge-600 hover:bg-forge-700 disabled:bg-gray-300 text-white text-sm font-medium rounded-lg transition-colors"
                                        >
                                            Create Project
                                        </button>
                                    </div>
                                    {error && <p className="mt-3 text-sm text-red-600">{error}</p>}
                                </div>
                            </div>
                        )}

                        {/* Upload Document Modal */}
                        {showUpload && (
                            <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/30">
                                <div className="bg-white rounded-xl shadow-2xl border border-gray-200 w-full max-w-2xl mx-4 p-6">
                                    <div className="flex items-center justify-between mb-4">
                                        <h2 className="text-lg font-bold text-gray-900">Upload Context Document</h2>
                                        <button onClick={() => setShowUpload(false)} className="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
                                    </div>
                                    <p className="text-sm text-gray-500 mb-4">Upload a document that will be added as context for generating artifacts. This could be existing specs, requirements, research, or any reference material.</p>
                                    <div className="space-y-4">
                                        <div className="flex gap-3">
                                            <div className="flex-1">
                                                <label className="block text-xs font-medium text-gray-700 mb-1.5">Document Name</label>
                                                <input
                                                    type="text"
                                                    value={uploadName}
                                                    onChange={e => setUploadName(e.target.value)}
                                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-forge-500 focus:border-forge-500 text-sm"
                                                    placeholder="e.g., existing-requirements.md"
                                                />
                                            </div>
                                            <div className="flex items-end">
                                                <label className="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-lg cursor-pointer transition-colors">
                                                    Browse File
                                                    <input type="file" accept=".md,.txt,.doc,.json" onChange={handleFileUpload} className="hidden" />
                                                </label>
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-gray-700 mb-1.5">Content</label>
                                            <textarea
                                                value={uploadContent}
                                                onChange={e => setUploadContent(e.target.value)}
                                                className="w-full h-64 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-forge-500 focus:border-forge-500 resize-none text-sm font-mono"
                                                placeholder="Paste or type your document content here..."
                                            />
                                        </div>
                                    </div>
                                    <div className="flex justify-end gap-3 mt-5">
                                        <button onClick={() => setShowUpload(false)} className="px-4 py-2 text-sm text-gray-600 hover:text-gray-800">Cancel</button>
                                        <button
                                            onClick={uploadDocument}
                                            disabled={!uploadName.trim() || !uploadContent.trim()}
                                            className="px-6 py-2 bg-forge-600 hover:bg-forge-700 disabled:bg-gray-300 text-white text-sm font-medium rounded-lg transition-colors"
                                        >
                                            Upload
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Run From Stage Modal */}
                        {showRunFrom && (
                            <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/30">
                                <div className="bg-white rounded-xl shadow-2xl border border-gray-200 w-full max-w-md mx-4 p-6">
