# TurboUI Generated App Server
server.port=${PORT:8080}

# SQLite JDBC (swap to PostgreSQL for production)
spring.datasource.url=jdbc:sqlite:${DB_PATH:data.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# Disable Spring's auto-init (we handle it in DatabaseInitializer)
spring.sql.init.mode=never

# Jackson: serialize nulls, use snake_case for JSON
spring.jackson.default-property-inclusion=non_null
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE
