# Configuration for NLP to Structured Data System
# Copy this file to settings.yaml and customize as needed

# LLM Provider Configuration
llm:
  # Default provider to use (anthropic, openai, mock)
  default_provider: "anthropic"
  
  # Anthropic Claude configuration
  anthropic:
    model: "claude-3-sonnet-20240229"
    max_tokens: 4000
    temperature: 0.1
    
  # OpenAI GPT configuration  
  openai:
    model: "gpt-4"
    max_tokens: 4000
    temperature: 0.1
    
  # Mock provider for testing
  mock:
    enabled: true
    delay_seconds: 0.5

# Data Processing Configuration
data:
  # Cache directory for temporary files
  cache_dir: "./cache"
  
  # Temporary files directory
  temp_dir: "./temp"
  
  # Maximum file size to process (MB)
  max_file_size_mb: 100
  
  # Auto-cleanup temporary files older than (hours)
  temp_cleanup_hours: 24
  
  # Default encoding for text files
  default_encoding: "utf-8"
  
  # Sample size for data preview
  sample_size: 5

# API Configuration
api:
  # Rate limiting delay between requests (seconds)
  rate_limit_delay: 0.1
  
  # Default cache TTL for API responses (seconds)
  cache_ttl: 3600
  
  # Maximum pages to fetch in pagination
  max_pages: 100
  
  # Request timeout (seconds)
  request_timeout: 30
  
  # Maximum concurrent requests
  max_concurrent_requests: 5

# File Format Specific Settings
formats:
  csv:
    # Auto-detect delimiter
    auto_detect_delimiter: true
    
    # Auto-detect encoding
    auto_detect_encoding: true
    
    # Skip blank lines
    skip_blank_lines: true
    
    # Maximum rows to sample for analysis
    sample_rows: 1000
    
  excel:
    # Default sheet to load (null for first sheet)
    default_sheet: null
    
    # Default header row (0-indexed)
    default_header_row: 0
    
    # Read formulas as values
    read_formulas: false
    
  json:
    # Auto-flatten nested structures
    auto_flatten: false
    
    # Maximum nesting depth to analyze
    max_depth: 10
    
    # Preserve array structure
    preserve_arrays: true
    
  api:
    # Default authentication type
    default_auth_type: "bearer"
    
    # Cache API responses by default
    cache_responses: true
    
    # Retry failed requests
    retry_attempts: 3
    
    # Retry delay (seconds)
    retry_delay: 1

# MCP Server Configuration
mcp:
  # Server host
  host: "localhost"
  
  # Server port
  port: 8000
  
  # Enable CORS
  enable_cors: true
  
  # Session timeout (minutes)
  session_timeout: 30
  
  # Maximum sessions
  max_sessions: 100

# Logging Configuration
logging:
  # Log level (DEBUG, INFO, WARNING, ERROR)
  level: "INFO"
  
  # Log format
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # Log to file
  log_to_file: true
  
  # Log file path
  log_file: "./logs/nlp_structured_data.log"
  
  # Rotate logs
  rotate_logs: true
  
  # Maximum log file size (MB)
  max_log_size_mb: 10

# Performance Configuration
performance:
  # Enable async processing
  async_processing: true
  
  # Worker thread pool size
  thread_pool_size: 4
  
  # Memory limit per operation (MB)
  memory_limit_mb: 512
  
  # Enable data streaming for large files
  enable_streaming: true
  
  # Streaming chunk size
  chunk_size: 1000

# Security Configuration
security:
  # Validate file uploads
  validate_uploads: true
  
  # Allowed file extensions
  allowed_extensions:
    - ".csv"
    - ".tsv" 
    - ".xlsx"
    - ".xls"
    - ".json"
    - ".jsonl"
    - ".ndjson"
    - ".parquet"
    - ".xml"
    - ".pdf"
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".bmp"
    - ".tiff"
    
  # Maximum upload size (MB)
  max_upload_size_mb: 50
  
  # Sanitize file paths
  sanitize_paths: true
  
  # Enable API key validation
  validate_api_keys: true

# Error Handling Configuration
error_handling:
  # Maximum retry attempts
  max_retries: 3
  
  # Retry delay (seconds)
  retry_delay: 1
  
  # Enable error recovery
  enable_recovery: true
  
  # Log errors to file
  log_errors: true
  
  # Include stack traces in errors
  include_stack_traces: false

# Development Configuration
development:
  # Enable debug mode
  debug: false
  
  # Enable hot reload
  hot_reload: false
  
  # Mock external services
  mock_external_services: false
  
  # Enable profiling
  enable_profiling: false