# PMO MCP Server Prompts Configuration
# All prompts and guidance text externalized for easy customization

# Tool Selection Guide
tool_selection_guide:
  title: "Tool Selection Guide"
  description: "Guidance for selecting the correct MCP tool based on user query context"
  content: |
    Tool Selection Guide:

    **Portfolio & Product Line Queries:**
    - If the user asks for hours and cost per resource for all projects in a portfolio (e.g., 'market & sell')
      without a time element, use get_projects_by_portfolio_and_product_line.
    - If the query includes a timeline (dates, months, etc.), use get_resources_by_portfolio_allocation.

    **Resource Allocation Queries:**
    - For project-level resource allocation with a time element, use get_project_resource_allocation.
    - For resource-level capacity/cost over a period, use get_resource_capacity_allocation.
    - For resource utilization, available capacity, or over/under-allocation analysis, use
      get_resource_capacity_allocation or get_resources_by_portfolio_allocation depending on scope.

    **General Overview Queries:**
    - For general project overviews, use get_all_projects.
    - For resource overviews, use get_all_resources.
    - For a summary, overview, or list of all projects/resources, use get_all_projects or get_all_resources.

    **Organizational Structure:**
    - For business structure, use get_business_lines or get_strategic_portfolios.
    - For product lines under a portfolio, use get_product_lines_by_portfolio.

    **Visualization Queries:**
    - If the user requests a chart, graph, plot, or visualization of resource/project data,
      use the chart rendering tools (e.g., forward_chart_json_to_d3_mcp, render_from_dataset).

    **Planning & Analysis:**
    - For project resource planning, gaps, or conflicts, use get_project_resource_allocation.
    - If the user specifies filters (e.g., by status, type, date), use get_projects_dynamic_filter
      or similar advanced filtering tools.

# Use Case Prompts
prompts:
  project_overview:
    title: "Project Overview Analysis"
    description: "Generate comprehensive project overview"
    content: |
      Generate a comprehensive project overview including:
      - Total number of projects
      - Projects by strategic portfolio
      - Technology vs non-technology projects
      - Project status distribution
      - Resource allocation summary

      Use get_all_projects() and get_business_lines() for this analysis.

  resource_utilization_analysis:
    title: "Resource Utilization Analysis"
    description: "Analyze resource utilization patterns"
    content: |
      Analyze resource utilization by:
      - Getting resource list with get_all_resources()
      - Analyzing capacity allocation for key resources
      - Identifying over/under-allocated resources
      - Providing recommendations for resource optimization

      Include specific date ranges for capacity analysis.

  portfolio_deep_dive:
    title: "Portfolio Deep Dive"
    description: "Detailed portfolio analysis"
    content: |
      Provide detailed portfolio analysis:
      - Get business lines structure
      - Analyze projects by strategic portfolio
      - Review resource allocation per portfolio
      - Identify portfolio resource constraints
      - Suggest portfolio balancing opportunities

  project_resource_planning:
    title: "Project Resource Planning"
    description: "Create project resource planning analysis"
    content: |
      Create project resource planning analysis:
      - Get project details and timelines
      - Analyze current resource allocations
      - Identify resource gaps or conflicts
      - Suggest resource reallocation opportunities
      - Provide capacity planning recommendations

  chart_generation_guidelines:
    title: "Chart Generation Guidelines"
    description: "Best practices for generating interactive charts"
    content: |
      Chart Generation Best Practices:
      
      **CRITICAL REQUIREMENTS:**
      1. **Data Labels**: ALWAYS enable data labels on chart elements (bars, lines, points)
         - Chart.js: Use chartjs-plugin-datalabels or built-in datalabels option
         - D3.js: Append text elements with values directly on SVG elements
      
      2. **Tooltips**: ALWAYS enable interactive tooltips showing detailed information
         - Chart.js: Built-in tooltip system with custom callbacks
         - D3.js: Add title elements or custom div tooltips with mouseover events
      
      3. **Legends**: Include clear legends for multi-series charts
      
      4. **Responsive Design**: Charts must adapt to container size
      
      **Chart.js Example with Data Labels & Tooltips:**
      ```javascript
      new Chart(ctx, {
        type: 'line',
        data: { labels: [...], datasets: [...] },
        options: {
          responsive: true,
          plugins: {
            datalabels: {
              display: true,
              color: '#444',
              font: { weight: 'bold' },
              formatter: (value) => value + ' hrs'
            },
            tooltip: {
              enabled: true,
              mode: 'index',
              intersect: false,
              callbacks: {
                label: function(context) {
                  return context.dataset.label + ': ' + context.parsed.y + ' hours';
                }
              }
            },
            legend: { display: true, position: 'bottom' }
          }
        }
      });
      ```
      
      **D3.js Example with Data Labels & Tooltips:**
      ```javascript
      // Data labels on bars
      svg.selectAll('.bar-label')
        .data(data)
        .enter().append('text')
        .attr('class', 'bar-label')
        .attr('x', d => x(d.name) + x.bandwidth()/2)
        .attr('y', d => y(d.value) - 5)
        .attr('text-anchor', 'middle')
        .text(d => d.value);
      
      // Tooltips with title elements
      svg.selectAll('rect')
        .append('title')
        .text(d => `${d.name}: ${d.value} hours`);
      ```
      
      **Multi-Line Resource Charts:**
      - ALWAYS include 4 series: Capacity, Planned Hours, Actual Hours, Available Capacity
      - Use distinct colors: Green (Capacity), Blue (Planned), Red (Actual), Orange (Available)
      - Show data labels on key points (min, max, current)
      - Enable crosshair or vertical line on hover
      
      **Summary Panels:**
      - Place above or beside charts
      - Show key metrics: totals, averages, utilization percentages
      - Use compact card layout with clear labels

