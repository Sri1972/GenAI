<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TurboUIGen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Scrollbar thumb — inline so Tailwind preflight cannot override */
      ::-webkit-scrollbar { width: 10px !important; height: 10px !important; }
      ::-webkit-scrollbar-track { background: #334155 !important; border-radius: 999px !important; }
      ::-webkit-scrollbar-thumb { background: #6366f1 !important; border-radius: 999px !important; min-height: 40px !important; }
      ::-webkit-scrollbar-thumb:hover { background: #a5b4fc !important; }
      * { scrollbar-width: thin; scrollbar-color: #6366f1 #334155; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
